services:
  nginx:
    build: ./nginx/development
    image: nginx
    container_name: nginx_ocloop
    ports:
      - 80:80
    depends_on:
      - ocloop
      - frontend
    volumes:
      - ./ocloop-backend/src:/src
      - static-vol:/vol/web/static
      - media-vol:/vol/web/media
      - ./nginx/development/default.conf:/etc/nginx/conf.d/default.conf
    # restart: unless-stopped

  ocloop:
    build:
      context: ./ocloop-backend
      dockerfile: development/Dockerfile
    command: >
      sh -c "python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"
    # python manage.py makemigrations &&
    # gunicorn ocloop_player.wsgi --bind 0.0.0.0:8000"
    # ports:
    #   - "8000:8000"
    volumes:
      - ./ocloop-backend/src:/src
      - static-vol:/vol/web/static
      - media-vol:/vol/web/media
    depends_on:
      db:
        condition: service_healthy
    # restart: unless-stopped
    env_file:
      - .env
      # - .env.local
      # - .env.development
      # - .env.development.local

  redis:
    image: redis:latest
    container_name: redis_ocloop
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # restart: always
    # restart: unless-stopped

  db:
    image: postgres:18.4
    container_name: ocloop_db
    ports:
      # don't use port in production, use docker network instead
      - "5432:5432"
    volumes:
      - ocloop-db:/var/lib/postgresql
    
      
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 1s
      timeout: 5s
      retries: 10
    # restart: unless-stopped


  frontend:
    build:
      context: ./ocl-cli-react
      dockerfile: Dockerfile

    container_name: ocloop-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./ocl-cli-react:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    depends_on:
      - ocloop

    restart: unless-stopped

volumes:
  ocloop-db:
  static-vol:
  media-vol:
  redis-data:
